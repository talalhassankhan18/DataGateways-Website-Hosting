name: Deploy to GitHub Pages

# Pushing to main is the deploy. There is no `npm run deploy` — the build that ships is the one
# this workflow produces, so a deploy cannot pick up uncommitted local state.
#
# This must stay the ONLY workflow that publishes to Pages. A repository has one Pages site, so a
# second publishing workflow does not merge with this one — it replaces it, and whichever job
# happens to deploy last is the site. A `Build and Deploy` workflow added on 17 Oct ran
# `jekyll-build-pages` over the repo root and published that; both workflows went green on every
# push, and the live site was whichever won the race. For a day it was the README rendered by the
# Jekyll primer theme. Sharing `concurrency: group: pages` did not prevent it — that queues jobs,
# it does not stop a second one overwriting the first.
#
# If something else needs to reach the deployed HTML, add a step here. Do not add a workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published, but only queue one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Action majors are pinned to ones that run on Node 24. The previous v4/v3 pins still work
      # but target Node 20, which GitHub has deprecated and now force-runs on 24 with a warning
      # on every job.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The repo requires >=22.12 (vitest 5 does not run on 20). Pinned to the lockfile.
          node-version: 22
          cache: npm

      # actions/configure-pages is deliberately NOT used here.
      #
      # It cannot help until Pages is already enabled, and it fails the whole build either way:
      # with `enablement: false` it throws on "Get Pages site failed", and with `enablement: true`
      # it then tries to create the site and gets "Resource not accessible by integration",
      # because GITHUB_TOKEN is not permitted to create a Pages site. Enabling Pages is a
      # one-time repository setting — Settings -> Pages -> Source: GitHub Actions — and no
      # workflow can do it for you.
      #
      # So the base path is derived locally instead. The build then always succeeds and produces
      # a correct artifact; only the deploy step waits on that setting.

      - run: npm ci

      - name: Build
        env:
          # Taken from the live Pages configuration rather than hardcoded or guessed from the
          # repo name, so this stays correct through a repo rename and through a custom domain
          # being attached — a custom domain serves from the root, where the prefix must vanish.
          #
          # A Pages project site is served from /<repo>/, so assets need that prefix. Taken from
          # the repository name, so a rename cannot silently produce a blank page.
          #
          # A custom domain serves from the root instead, where the prefix must disappear. That
          # is a repository variable rather than an edit here: set PAGES_BASE_PATH to "/" under
          # Settings -> Secrets and variables -> Actions -> Variables. vite.config.ts normalises
          # whatever arrives, so "/", "" and "/repo" all resolve correctly.
          VITE_BASE: ${{ vars.PAGES_BASE_PATH || format('/{0}', github.event.repository.name) }}
        # Only the web app: the Express API in apps/api cannot run on a static host, and the site
        # already calls the external API named in apps/web/.env.production.
        run: npm run build:pages

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
