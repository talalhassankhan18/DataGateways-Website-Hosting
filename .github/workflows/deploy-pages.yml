name: Deploy to GitHub Pages

# Pushing to main is the deploy. There is no `npm run deploy` — the build that ships is the one
# this workflow produces, so a deploy cannot pick up uncommitted local state.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published, but only queue one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The repo requires >=22.12 (vitest 5 does not run on 20). Pinned to the lockfile.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # A GitHub Pages *project* site is served from /<repo>/, so every asset URL needs that
          # prefix. Derived from the repository name rather than hardcoded, so renaming the repo
          # does not silently produce a blank page. A custom domain serves from the root instead —
          # see the note in the deploy step below.
          VITE_BASE: /${{ github.event.repository.name }}/
        # Only the web app: the Express API in apps/api cannot run on a static host, and the site
        # already calls the external API named in apps/web/.env.production.
        run: npm run build:pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # If a custom domain is ever attached to this Pages site, the site moves to the domain root
      # and VITE_BASE above must become `/` — otherwise every asset gains a prefix that is no
      # longer part of the URL. That is the one change a domain switch requires.
      - id: deployment
        uses: actions/deploy-pages@v4
