name: Deploy to GitHub Pages

# Pushing to main is the deploy. There is no `npm run deploy` — the build that ships is the one
# this workflow produces, so a deploy cannot pick up uncommitted local state.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published, but only queue one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Action majors are pinned to ones that run on Node 24. The previous v4/v3 pins still work
      # but target Node 20, which GitHub has deprecated and now force-runs on 24 with a warning
      # on every job.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The repo requires >=22.12 (vitest 5 does not run on 20). Pinned to the lockfile.
          node-version: 22
          cache: npm

      # Must come before the build: it is what turns Pages on for this repository when it is not
      # already on, and the deploy step 404s otherwise ("Failed to create deployment"). It also
      # reports the site's real base path, which is what the build needs.
      #
      # `enablement: true` only works where the account permits it. If this step fails, set it by
      # hand once: repo Settings -> Pages -> Source: GitHub Actions.
      - id: pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - run: npm ci

      - name: Build
        env:
          # Taken from the live Pages configuration rather than hardcoded or guessed from the
          # repo name, so this stays correct through a repo rename and through a custom domain
          # being attached — a custom domain serves from the root, where the prefix must vanish.
          #
          # base_path is "/my-repo" for a project site and "" for a user site or custom domain.
          # Passed through raw: vite.config.ts normalises both to a valid base, which keeps the
          # fragile string-building out of a YAML expression that cannot be tested locally.
          VITE_BASE: ${{ steps.pages.outputs.base_path }}
        # Only the web app: the Express API in apps/api cannot run on a static host, and the site
        # already calls the external API named in apps/web/.env.production.
        run: npm run build:pages

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
